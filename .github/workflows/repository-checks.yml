name: Repository rules and capability leaves
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm --prefix tools ci --ignore-scripts
      - run: npm --prefix tools run check
